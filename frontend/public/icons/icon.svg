<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="108" fill="#304B38"/>
  <!-- Topographic contour rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#E8EDE5" stroke-width="2" stroke-opacity="0.15" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#E8EDE5" stroke-width="2" stroke-opacity="0.2"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#E8EDE5" stroke-width="2" stroke-opacity="0.25"/>

  <!-- Himalayan Peaks -->
  <!-- Left Ridge -->
  <polygon points="76,380 200,180 280,310 210,380" fill="#242722" opacity="0.6"/>
  <!-- Main Peak (Nanda Devi style) -->
  <polygon points="120,380 256,120 392,380" fill="#E8EDE5"/>
  <!-- Peak Shadow / South Face -->
  <polygon points="256,120 392,380 256,380" fill="#CFCABF"/>
  <!-- East Ridge Ridge Accent -->
  <polygon points="310,240 436,380 256,380" fill="#B3834D" opacity="0.85"/>

  <!-- Ridge highlights -->
  <path d="M 256,120 L 256,380" stroke="#304B38" stroke-width="4" stroke-linecap="round"/>
  <path d="M 256,120 L 120,380" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
  <path d="M 256,120 L 392,380" stroke="#A89E8D" stroke-width="5" stroke-linejoin="round"/>

  <!-- Compass / Field Guide Mark -->
  <circle cx="256" cy="74" r="8" fill="#B3834D"/>
  <line x1="256" y1="56" x2="256" y2="92" stroke="#E8EDE5" stroke-width="2"/>
  <line x1="238" y1="74" x2="274" y2="74" stroke="#E8EDE5" stroke-width="2"/>

  <!-- Footprint baseline bar -->
  <rect x="100" y="408" width="312" height="14" rx="7" fill="#E8EDE5" opacity="0.9"/>
  <rect x="140" y="432" width="232" height="6" rx="3" fill="#B3834D" opacity="0.8"/>
</svg>
