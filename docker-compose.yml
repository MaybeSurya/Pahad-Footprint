version: '3.8'

services:
  # ==============================================================================
  # PostgreSQL 16 Database
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: pahad_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-pahad_footprint}
      POSTGRES_USER: ${DB_USER:-pahad_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pahad_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pahad_user} -d ${DB_NAME:-pahad_footprint}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pahad_network

  # ==============================================================================
  # Express Backend Service
  # ==============================================================================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pahad_server
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgres://${DB_USER:-pahad_user}:${DB_PASSWORD:-pahad_password}@postgres:5432/${DB_NAME:-pahad_footprint}
      JWT_SECRET: ${JWT_SECRET:-pahad-secret-production-2026}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    networks:
      - pahad_network

  # ==============================================================================
  # Next.js 14 Frontend Service
  # ==============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pahad_frontend
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://server:5000/api
    depends_on:
      - server
    ports:
      - "3000:3000"
    networks:
      - pahad_network

  # ==============================================================================
  # Nginx Reverse Proxy
  # ==============================================================================
  nginx:
    image: nginx:alpine
    container_name: pahad_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - server
    networks:
      - pahad_network

networks:
  pahad_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
